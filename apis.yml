  workcells and dynamically restricting or resuming robot motion. Backed by GV and
  Lux Capital, the company''s assets - including FreeMove and related intellectual
  property - were acquired by Symbotic in July 2024, and veobot.com now redirects
  to symbotic.com. Veo Robotics published no public API surface; this profile records
  the company in the API Evangelist network graph.'
